name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the event commit
        timeout-minutes: 3
        env:
          CI_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          auth=$(printf 'x-access-token:%s' "$CI_TOKEN" | base64 | tr -d '\n')
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0=http.extraheader \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          unset auth CI_TOKEN
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install Rust toolchain
        timeout-minutes: 3
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Formatting
        timeout-minutes: 3
        run: ./scripts/preflight.sh fmt
      - name: Clippy including nursery
        timeout-minutes: 3
        run: ./scripts/preflight.sh clippy
      - name: Native and compatibility protocol tests
        timeout-minutes: 3
        run: ./scripts/preflight.sh test
